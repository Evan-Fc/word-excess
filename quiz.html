<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词汇测验 - ICT专业词汇学习系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF5252 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .nav-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            transition: background 0.3s ease;
        }
        
        .nav-btn:hover, .nav-btn.active {
            background: rgba(255,255,255,0.3);
        }
        
        .main-content {
            padding: 30px;
        }
        
        .quiz-setup {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .setup-options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .option-group {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            min-width: 200px;
        }
        
        .option-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        .option-btn {
            display: block;
            width: 100%;
            background: white;
            border: 2px solid #e0e0e0;
            padding: 10px;
            margin: 5px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .option-btn:hover, .option-btn.active {
            background: #FF6B6B;
            color: white;
            border-color: #FF6B6B;
        }
        
        .start-btn {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            border: none;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin-top: 20px;
        }
        
        .start-btn:hover {
            transform: scale(1.05);
        }
        
        .quiz-container {
            display: none;
        }
        
        .quiz-progress {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
        }
        
        .question-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .question-text {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
        }
        
        .answer-input {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1em;
            margin-bottom: 20px;
        }
        
        .answer-input:focus {
            outline: none;
            border-color: #FF6B6B;
        }
        
        .check-btn {
            background: #FF6B6B;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            border: none;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .check-btn:hover {
            background: #FF5252;
        }
        
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        
        .feedback.correct {
            background: #E8F5E9;
            color: #4CAF50;
            border: 2px solid #4CAF50;
        }
        
        .feedback.incorrect {
            background: #FFEBEE;
            color: #F44336;
            border: 2px solid #F44336;
        }
        
        .next-btn {
            background: #2196F3;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            border: none;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
            display: none;
        }
        
        .quiz-result {
            text-align: center;
            display: none;
        }
        
        .result-score {
            font-size: 3em;
            font-weight: bold;
            margin: 20px 0;
        }
        
        .result-message {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #666;
        }
        
        .back-btn {
            display: inline-block;
            background: #666;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            margin: 10px;
        }
        
        @media (max-width: 768px) {
            .setup-options {
                flex-direction: column;
                align-items: center;
            }
            
            .option-group {
                width: 100%;
                max-width: 300px;
            }
            
            .question-text {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 词汇测验</h1>
            <p>测试你的ICT专业词汇掌握程度</p>
            
            <div class="nav">
                <a href="/" class="nav-btn">🏠 首页</a>
                <a href="/learn" class="nav-btn">📖 学习</a>
                <a href="/quiz" class="nav-btn active">🎯 测验</a>
            </div>
        </div>
        
        <div class="main-content">
            <!-- 测验设置 -->
            <div class="quiz-setup" id="quizSetup">
                <h2>设置测验参数</h2>
                
                <div class="setup-options">
                    <div class="option-group">
                        <div class="option-title">📂 选择分类</div>
                        <button class="option-btn active" data-category="all">全部词汇</button>
                        {% for cat in categories %}
                        <button class="option-btn" data-category="{{ cat }}">{{ cat }}</button>
                        {% endfor %}
                    </div>
                    
                    <div class="option-group">
                        <div class="option-title">🔢 题目数量</div>
                        <button class="option-btn active" data-count="10">10题</button>
                        <button class="option-btn" data-count="20">20题</button>
                        <button class="option-btn" data-count="30">30题</button>
                    </div>
                </div>
                
                <button class="start-btn" onclick="startQuiz()">🚀 开始测验</button>
            </div>
            
            <!-- 测验进行中 -->
            <div class="quiz-container" id="quizContainer">
                <div class="quiz-progress" id="quizProgress">第 1 题 / 共 10 题</div>
                
                <div class="question-card">
                    <div class="question-text" id="questionText">题目加载中...</div>
                    
                    <input type="text" class="answer-input" id="answerInput" placeholder="请输入你的答案..." autocomplete="off">
                    
                    <button class="check-btn" onclick="checkAnswer()">✅ 检查答案</button>
                    
                    <div class="feedback" id="feedback"></div>
                    
                    <button class="next-btn" onclick="nextQuestion()" id="nextBtn">➡️ 下一题</button>
                </div>
            </div>
            
            <!-- 测验结果 -->
            <div class="quiz-result" id="quizResult">
                <h2>🎉 测验完成！</h2>
                <div class="result-score" id="resultScore">0/10</div>
                <div class="result-message" id="resultMessage">正在计算成绩...</div>
                
                <div>
                    <a href="/quiz" class="back-btn">🔄 重新测验</a>
                    <a href="/" class="back-btn">🏠 返回首页</a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let currentQuiz = [];
        let currentQuestionIndex = 0;
        let correctAnswers = 0;
        let selectedCategory = 'all';
        let selectedCount = 10;
        
        // 设置选项按钮事件
        document.querySelectorAll('.option-btn[data-category]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.option-btn[data-category]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedCategory = this.getAttribute('data-category');
            });
        });
        
        document.querySelectorAll('.option-btn[data-count]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.option-btn[data-count]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedCount = parseInt(this.getAttribute('data-count'));
            });
        });
        
        // 开始测验
        async function startQuiz() {
            try {
                const response = await fetch(`/api/quiz/random?count=${selectedCount}&category=${selectedCategory}`);
                currentQuiz = await response.json();
                
                if (currentQuiz.length === 0) {
                    alert('该分类下没有足够的词汇进行测验！');
                    return;
                }
                
                currentQuestionIndex = 0;
                correctAnswers = 0;
                
                document.getElementById('quizSetup').style.display = 'none';
                document.getElementById('quizContainer').style.display = 'block';
                document.getElementById('quizResult').style.display = 'none';
                
                showQuestion();
            } catch (error) {
                alert('加载测验题目失败，请重试！');
                console.error(error);
            }
        }
        
        // 显示当前题目
        function showQuestion() {
            const question = currentQuiz[currentQuestionIndex];
            document.getElementById('quizProgress').textContent = `第 ${currentQuestionIndex + 1} 题 / 共 ${currentQuiz.length} 题`;
            document.getElementById('questionText').textContent = question.question;
            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').focus();
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }
        
        // 检查答案
        async function checkAnswer() {
            const userAnswer = document.getElementById('answerInput').value.trim();
            if (!userAnswer) {
                alert('请输入答案！');
                return;
            }
            
            const question = currentQuiz[currentQuestionIndex];
            
            try {
                const response = await fetch('/api/quiz/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        word: question.word,
                        user_answer: userAnswer,
                        correct_answer: question.answer,
                        direction: question.direction
                    })
                });
                
                const result = await response.json();
                
                const feedback = document.getElementById('feedback');
                if (result.correct) {
                    feedback.className = 'feedback correct';
                    feedback.innerHTML = `✅ 回答正确！<br>掌握程度: ${Math.round(result.mastery * 100)}%`;
                    correctAnswers++;
                } else {
                    feedback.className = 'feedback incorrect';
                    feedback.innerHTML = `❌ 回答错误！<br>正确答案: ${result.correct_answer}<br>掌握程度: ${Math.round(result.mastery * 100)}%`;
                }
                
                feedback.style.display = 'block';
                document.getElementById('nextBtn').style.display = 'inline-block';
                
            } catch (error) {
                alert('检查答案失败，请重试！');
                console.error(error);
            }
        }
        
        // 下一题
        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex < currentQuiz.length) {
                showQuestion();
            } else {
                showResult();
            }
        }
        
        // 显示测验结果
        function showResult() {
            const score = correctAnswers;
            const total = currentQuiz.length;
            const percentage = Math.round((score / total) * 100);
            
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('quizResult').style.display = 'block';
            
            document.getElementById('resultScore').textContent = `${score}/${total}`;
            
            let message = '';
            if (percentage >= 90) {
                message = '🎉 太棒了！你是ICT词汇大师！';
            } else if (percentage >= 70) {
                message = '👍 很不错！继续加油！';
            } else if (percentage >= 50) {
                message = '💪 继续努力，你可以做得更好！';
            } else {
                message = '📚 需要多加练习，加油！';
            }
            
            document.getElementById('resultMessage').textContent = `得分: ${percentage}% - ${message}`;
        }
        
        // 回车键检查答案
        document.getElementById('answerInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('nextBtn').style.display === 'none') {
                    checkAnswer();
                } else {
                    nextQuestion();
                }
            }
        });
    </script>
</body>
</html>
